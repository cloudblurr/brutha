services:
  brutha:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Required: supply via a .env file or your shell (never commit secrets).
      XAI_API_KEY: ${XAI_API_KEY:?set XAI_API_KEY in your environment or a .env file}
      XAI_MODEL: ${XAI_MODEL:-grok-3}
      # Supabase connection (all data/auth/storage live in Supabase now — the
      # container itself is stateless, so no persistent volume is needed).
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?set NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?set NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      NODE_ENV: production
    restart: unless-stopped
