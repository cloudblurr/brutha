# Render Blueprint for BRUTHA (Grok Agent)
# Deploy: push to GitHub, then in Render → New → Blueprint → pick this repo.
#
# The app is now STATELESS — all data, auth, and storage live in Supabase — so
# no persistent disk is required. This also means it deploys cleanly to Vercel
# (the recommended target; see DEPLOYMENT.md). This blueprint is kept for users
# who prefer a container host.
services:
  - type: web
    name: brutha
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      # ---- Required ----
      - key: XAI_API_KEY
        sync: false # set the real value in the Render dashboard (secret)
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # ---- Optional model tuning ----
      - key: XAI_MODEL
        value: grok-3
      - key: NODE_ENV
        value: production
      # ---- Optional: which OAuth providers to show (configured in Supabase) ----
      # - key: NEXT_PUBLIC_AUTH_PROVIDERS
      #   value: github,google
      # ---- Optional: SMTP for the email tool ----
      # - key: SMTP_HOST
      #   sync: false
      # - key: SMTP_PORT
      #   value: "587"
      # - key: SMTP_USER
      #   sync: false
      # - key: SMTP_PASS
      #   sync: false
      # - key: SMTP_FROM
      #   sync: false
