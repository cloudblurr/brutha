# Supabase config for BRUTHA.
#
# This file lets `supabase start` spin up a full local stack (Postgres, Auth,
# Storage, Realtime, Edge Functions) for development, and `supabase db push`
# / `supabase functions deploy` to ship to a hosted project.
project_id = "brutha"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
# Local mailbox to catch Auth confirmation emails during development.
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# Update site_url / additional_redirect_urls to your deployed domain(s).
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# For local dev we don't force email confirmation so the credentials flow is
# instant. Turn this ON in the hosted project for production.
enable_confirmations = false

# OAuth providers — set the secrets via env (SUPABASE_AUTH_EXTERNAL_*_SECRET)
# or in the hosted dashboard. Disabled by default so the app runs zero-config.
[auth.external.github]
enabled = false
client_id = "env(SUPABASE_AUTH_GITHUB_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GITHUB_SECRET)"

[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"

[edge_runtime]
enabled = true

[functions.run-worker]
verify_jwt = false
